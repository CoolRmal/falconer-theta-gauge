version: "v0.4"

project:
  name: "Falconer's distance problem for stretched logarithmic gauges"
  description: >-
    A Lean 4 formalization of Theorem 1.1 of the supplied October 2026
    manuscript: every compact subset of the Euclidean plane with positive
    Hausdorff measure for the gauge r exp(-(log(1/r))^theta), with
    2/3 < theta < 1, has a distance set of positive Lebesgue measure.
    The proof constructs gauge Frostman probabilities with finite logarithmic
    critical and Fourier energies, obtains the required radial Orlicz
    densities, and decomposes the measures into finite-depth regular pieces.
    Measurable directional tests and smooth masks define actual filtered
    distance measures with summable removed mass. Quantitative stationary
    phase, inverse operators, orthogonality, distance linearization, and space
    splitting prove all four induction recurrences for the actual energies.
    A weighted finite-tree argument yields summable frequency-shell bounds;
    Fourier reconstruction gives absolute continuity of a nonzero weighted
    distance measure and hence the stated positive Lebesgue measure.
    The target theorem builds without proof holes and uses only the three
    standard Lean axioms. Source adaptations are recorded under fidelity.
  authors:
    - "Yongxi Lin"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yongxi Lin"

