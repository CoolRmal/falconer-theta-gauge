version: "v0.4"

project:
  name: "Falconer's distance problem for stretched logarithmic gauges"
  description: >-
    A Lean 4 development targeting Theorem 1.1 of the supplied October 2026
    manuscript: every compact subset of the Euclidean plane with positive
    Hausdorff measure for the gauge r exp(-(log(1/r))^theta), with
    2/3 < theta < 1, has a distance set of positive Lebesgue measure.
    The exact statement, gauge Frostman measure, finite logarithmic critical
    energies, weighted Fourier energy, full parameter budgets, and full
    summable Fourier reconstruction and regular decomposition are proved.
    The averaged orthogonal-projection Orlicz estimate is proved.
    The exact maximal-cell excess-function bounds are proved.
    The target-specific radial endpoint and uniform eighth-order spread on
    compact retained carriers are proved using all logarithmic energy orders.
    Actual entry bounds, finite scheduled tests, uniform nonstationary decay,
    and finite-order smooth bumps with factorial derivative bounds are proved.
    Literal directional Markov tests, smooth masks, weighted filtered mass
    bounds on all retained regular pieces, exact directional average counts,
    the common closed direction arc, actual finite induction trees, and all
    four scalar binning estimates are
    proved. Quadratic and localized stationary expansions have uniform actual
    derivative budgets and the numerical stationary operator bound. Literal
    inverse operator cancellation, numerical norms, finite inversion tails, and
    full circular stationary phase for smooth amplitudes are proved. Actual
    Fourier and distance energies and the positive-measure low/high bridge
    and the literal scheduled Lemma 7.4 are proved. Estimates 7.5 and 7.6 are
    proved for actual shell and Fourier energies. Estimate 7.7 is proved for
    actual weighted distance energies. The full inverse-circle Fourier series
    has summable coefficients with bound 11/10; actual nonzero-symbol graph
    degrees and angular and radial cancellation budgets are proved.
    The actual far-cell geometry, circular formula, passing support and
    twice-integrated radial kernel are proved. Estimate 7.8 and the final
    induction remain unfinished.
  authors:
    - "Yongxi Lin"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yongxi Lin"

