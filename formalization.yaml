# Development metadata only. Theorem 1.1 is unfinished and cannot be registered.
version: "v0.4"

project:
  name: "Falconer's distance problem for stretched logarithmic gauges"
  description: >-
    A Lean 4 development targeting Theorem 1.1 of the supplied October 2026
    manuscript: every compact subset of the Euclidean plane with positive
    Hausdorff measure for the gauge r exp(-(log(1/r))^theta), with
    2/3 < theta < 1, has a distance set of positive Lebesgue measure.
    The exact statement, gauge Frostman measure, finite logarithmic critical
    energies, weighted Fourier energy, full parameter budgets, and full
    summable Fourier reconstruction and regular decomposition are proved.
    The averaged orthogonal-projection Orlicz estimate is proved.
    The exact maximal-cell excess-function bounds are proved.
    The radial endpoint transfer is under development.
    The main geometric proof is unfinished.
  authors:
    - "Yongxi Lin"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yongxi Lin"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.CA"]
  msc2020: ["28A80", "42B10"]

sources:
  - title: >-
      Falconer's distance problem for the gauges r exp(-(log(1/r))^theta),
      theta > 2/3: a complete proof with scale-dependent parameters
    type: "manuscript"
    id: "8 October 2026, Theorem 1.1, pages 2-3"
    location: "docs/falconer-theta-gauge-proof.pdf"
    relationship: "formalizes"
    note: >-
      The uploaded manuscript is the informal mathematical source. Its PDF
      does not print a named author; no manuscript authorship is inferred
      from the user's separate confirmation of the formalization author
      and responsible maintainer. Source SHA-256:
      820db3291bf9ebc45ea67abf597f60d46c127ab2844e2eea8c3754c81e284fb3.

related_formalizations: []

status:
  scope: >-
    The selected target is FalconerThetaGauge.theorem_one_one, with exactly
    the manuscript's parameter interval, compactness hypothesis, positive
    gauge-Hausdorff-measure hypothesis, and unpinned distance-set conclusion.
    Gauge Frostman, logarithmic critical and Fourier energy, full parameter
    budgets, separated-measure geometry, summable reconstruction, and full
    finite-depth regular decomposition are proved. Concrete orthogonal
    densities and the full averaged Orlicz bound are also proved.
    The theorem still contains a proof hole. These counts exclude the
    independent Challenge's deliberate specification hole.
  sorry_count: 1
  sorry_in_definitions: 0
