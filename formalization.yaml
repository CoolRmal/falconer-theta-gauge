status:
  scope: >-
    The selected target is FalconerThetaGauge.theorem_one_one, with exactly
    the manuscript's parameter interval, compactness hypothesis, positive
    gauge-Hausdorff-measure hypothesis, and unpinned distance-set conclusion.
    Gauge Frostman, logarithmic critical and Fourier energy, full parameter
    budgets, separated-measure geometry, summable reconstruction, and full
    finite-depth regular decomposition are proved. Concrete orthogonal
    densities and the full averaged Orlicz bound are also proved. Target-specific
    radial preparation has a uniform eighth-order moment at every retained pin.
    Finite schedule arithmetic and uniform nonstationary estimates are proved.
    Actual weighted distance filtering has summable removed mass for concrete
    finite filters assembled across all actual retained pieces. Genuine chains
    and trees satisfy all finite budgets.
    Quadratic stationary phase and its literal circular Morse substitution
    are proved for smooth compact amplitudes. The main proof is reduced to
    absolute continuity of the actual prepared weighted distance measure.
    The theorem still contains a proof hole. These counts exclude the
    independent Challenge's deliberate specification hole.
