name: Lean build and Comparator

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      authorization_relationship:
        description: Your relationship to the substantive formalization
        required: true
        type: choice
        options:
          - I am a responsible author or maintainer
          - I have approval from a responsible author or maintainer

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions and the Comparator recipe follow PalomarRegistry/PalomarTemplate
# at 2891de4c48955af824969a263d31b25e7a9a1406. A build permits the independent
# Challenge's deliberate sorry; the separate Comparator job rejects proof holes
# in Solution and its theorem dependencies. A green build alone is not completion.
jobs:
  build:
    name: Build Lean modules
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Build the proof development and independent specification
        run: lake build FalconerThetaGauge Challenge Solution
      - name: Reject proof holes and nonstandard axiom dependencies in Solution
        run: python3 scripts/check-proof-status.py

  comparator:
    name: Compare Theorem 1.1 and verify its proof
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          build: false
          use-github-cache: true
          use-mathlib-cache: true
      - name: Enable the Linux Comparator sandbox
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compare statements and check with Lean, NanoDa, and con-ron
        run: ./scripts/verify-comparator.sh

  preflight-inputs:
    name: Identify the full mechanical preflight
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
    steps:
      - name: Generate an opaque request identifier
        id: request
        env:
          REQUEST_KEY: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          request_id = hashlib.sha256(os.environ["REQUEST_KEY"].encode()).hexdigest()[:12]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"request_id={request_id}\n")
          PY

  mechanical:
    name: Full Palomar mechanical preflight
    if: github.event_name == 'workflow_dispatch'
    needs: preflight-inputs
    # This verifies the exact public snapshot; it does not submit or register it.
    # Metadata and a completed proof are required for this job to pass.
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: ${{ needs.preflight-inputs.outputs.request_id }}
      mode: full
      execution_profile: palomar-standard-v1
      options: ${{ format('{{"comparator_config_path":"comparator.json","authorization_relationship":{0}}}', toJSON(inputs.authorization_relationship)) }}
